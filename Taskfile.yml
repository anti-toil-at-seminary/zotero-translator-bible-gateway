version: "3"
vars:
  SOURCE: '{{ .SOURCE | default "BibleGateway.js" }}'
  SOURCE_FILE: '{{ base .SOURCE }}'
  UPSTREAM_REPO: '{{ .UPSTREAM_REPO | default .CLI_ARGS | default "../translators" }}'
  REMOTE: '{{ .UPSTREAM_REMOTE | default "origin" }}'
  THIS_BRANCH:
    sh: git branch --show-current
  TARGET_FILE: '{{ .UPSTREAM_REPO }}/{{ .SOURCE_FILE }}'
  TARGET_BRANCH_FROM_FILE:
    sh: |
      if test -x '.target_branch'; then
        ./.target_branch
      elif test -f .target_branch; then
        cat .target_branch
      fi
  DEFAULT_TARGET_BRANCH:
    sh: >
      test -n '{{ .TARGET_BRANCH_FROM_FILE }}'
      && echo -n '{{ .TARGET_BRANCH_FROM_FILE }}'
      || echo -n '{{ .THIS_BRANCH }}'
  TARGET_BRANCH: '{{ .TARGET_BRANCH | default .DEFAULT_TARGET_BRANCH }}'
  GHA_DOCKERFILE_DEV: "https://raw.githubusercontent.com/pretty-weed/toolbelt/main/docker/ci_tools/Dockerfile"
  BASE_DOCKERFILE: ".task/Dockerfile.base"
includes:
  ciContainers: https://raw.githubusercontent.com/pretty-weed/toolbelt/main/task/container/Taskfile-ci-containers.yml
  containerLib: https://raw.githubusercontent.com/pretty-weed/toolbelt/main/task/container/Taskfile.yml


tasks:
  clean:
    cmd: rm -rf .ci/pull-request-check/connectors
  install:
    cmd: install -m 0644 '{{ .SOURCE }}' "{{ .UPSTREAM_REPO }}/{{ .SOURCE_FILE}}"
  fetch:
    cmd: "sed 's/\"inRepository\": true,/\"inRepository\": false,/' {{ .TARGET_FILE }} > {{ .SOURCE_FILE }}"

  compare-upstream:
    aliases: ["cmp", "diff", "compare"]
    cmds:
      - diff '{{ .TARGET_FILE }}' '{{ .SOURCE_FILE }}'
  install-upstream:
    cmds:
      - install -m 0644 '{{ .SOURCE }}' '{{ .TARGET_FILE }}'
    sources:
      - '{{ .SOURCE }}'
    generates:
      - '{{ .TARGET_FILE }}'
  update-upstream:
    desc: set inRepository to true
    deps:
      - install-upstream
    cmds:
      - |
        sed -i "s/\"lastUpdated\": \"[0-9- :]\"/\"lastUpdated\": \"$(date '+%Y-%m-%d %H:%M:%S')\"" {{ .TARGET_FILE }}
        sed -i 's/\"inRepository\": \(true|false\),/\"inRepository\": true,' {{ .TARGET_FILE }}
      - |
        node -e '
          const fs = require("fs");
          const file = process.argv[1];
          let content = fs.readFileSync(file, "utf8");
          const now = new Date().toISOString().replace("T", " ").slice(0, 19);
          content = content
            .replace(/"inRepository":\s*false/, "\"inRepository\": true")
            .replace(/"lastUpdated":\s*"[^"]*"/, `"lastUpdated": "${now}"`);
          fs.writeFileSync(file, content, "utf8");
        ' "{{.UPSTREAM_DIR}}/{{.TRANSLATOR_FILE}}"
  push-upstream:
    preconditions:
      - sh: git diff --quiet -- ":(exclude)Taskfile.yml"
        msg: No local changes before pushing!
    deps:
      - install-upstream
      - update-upstream
    vars:
      SOURCE_COMMIT:
        sh: git rev-parse --short HEAD
      COMMIT_MSG_BASE:
        sh: >
          test -f '{{ .TARGET_FILE }}' && echo "Updating translator {{ .SOURCE_FILE }}"
          || echo "Adding new translator {{ .SOURCE_FILE }}"
      # TODO: Add source repo (remote origin) info to this
      COMMIT_MSG: '{{.COMMIT_MSG_BASE}} from {{ .THIS_BRANCH }} {{ .SOURCE_COMMIT }}'
      CREATE_MISSING_BRANCH: '{{ .CREATE_MISSING_BRANCH | default "YES" }}'
      doesnt_exist_error: sh -c 'echo "branch {{ .TARGET_BRANCH }} does not exist" && exit 13'
      checkout_new_branch: git checkout -b '{{.TARGET_BRANCH}}'
      IF_MISSING_BRANCH: '{{ if eq .CREATE_MISSING_BRANCH "YES" }}{{ .checkout_new_branch }}{{ else }}{{ .doesnt_exist_error }}{{ end }}'
    cmds:
      - |
        cd {{ .UPSTREAM_REPO }}
        current_branch="$(git branch --show-current)"
        git rev-parse '{{ .TARGET_BRANCH }}' && git checkout '{{ .TARGET_BRANCH }}' || {{ .IF_MISSING_BRANCH }}
        git add '{{ .SOURCE_FILE }}'
        git commit -m '{{ .COMMIT_MSG }}' && git push -u {{ .REMOTE }} {{ .TARGET_BRANCH }}
  lint:
    dir: .ci
    cmds:
      - ./lint.sh
  lint-fix:
    dir: .ci
    cmds:
      - ./lint.sh -- --fix

  update-connectors:
    run: when_changed
    dir: ".ci/pull-request-check"
    internal: true
    status:
      - test ! -d connectors/.git
    cmds:
      - cd connectors && git pull
  clone-connectors:
    run: when_changed
    dir: ".ci/pull-request-check"
    internal: true
    status:
      - test -d connectors/.git
    cmds:
      - git clone https://github.com/zotero/zotero-connectors.git connectors
  fetch-connectors:
    run: when_changed
    cmds:
      - task: update-connectors
      - task: clone-connectors
  ci-img:
    run: when_changed
    vars:
      UID:
        sh: id -u
      GID:
        sh: id -g
    env:
      BASEFILE: '{{ .BASE_DOCKERFILE }}'
      HOST_UID: '{{ .UID }}'
      HOST_GID: '{{ .GID }}'

    deps:
      - fetch-connectors
      - task: containerLib:get-dockerfile
        vars:
          GET_SOURCE: '{{ .GHA_DOCKERFILE_DEV }}'
          DEST: '{{ .BASE_DOCKERFILE }}'
    cmds:
      - pwd
      - >
        docker buildx bake -f tooling/docker-bake.hcl
        --allow=fs.read='{{ .BASE_DOCKERFILE }}'
        --allow=fs.read="$(pwd)"
        "default"

  ci-run:
    deps:
      - ci-img
    requires:
      vars: ["SH"]
    cmds:
      - task: containerLib:in-container
        vars:
          IMAGE: "zotero-translator-bible-gateway-testing:latest"
          SH: '{{ .SH }}'

  ci-check:
    vars:
      POST_RUN_CMD: '{{ if .POST_RUN }}{{ if not (.POST_RUN | hasPrefix "&&") }}&& {{end}}{{ end }}'
    cmds:
      - task: ci-run
        vars:
          SH: |
            npx puppeteer browsers install chrome
            export BROWSER_EXECUTABLE='/home/ubuntu/.cache/puppeteer/chrome/linux-156.0.8078.47/chrome-linux64/chrome'
            export CHROMEDRIVER_ARGUMENTS='--no-sandbox --disable-dev-shm-usage --headless'
            cd /workdir/.ci/pull-request-check
            git config --global --add safe.directory /workdir
            ./check-pull-request.sh{{- if .POST_RUN_CMD }} {{ .POST_RUN_CMD }}{{- end -}}
  ci-smoke:
    desc: Run container smoke tests to verify Chrome and ChromeDriver dependencies
    cmds:
      - task: ci-run
        vars:
          SH: |
            echo '=== Checking Playwright Installation ==='
            npx playwright --version
            echo '=== Testing Headless Chromium Execution via Playwright ==='
            node -e \"
              const { chromium } = require('playwright');
              (async () => {
                const browser = await chromium.launch({ headless: true });
                const page = await browser.newPage();
                await page.goto('https://example.com');
                console.log('Page Title:', await page.title());
                await browser.close();
                console.log('Success! Playwright browser executed headless perfectly.');
              })().catch(err => {
                console.error('Browser Execution Failed:', err);
                process.exit(1);
              });
            \"
  ci-check-cmd:
    deps:
      - ci-img
    cmds:
      - task: ci-run
        vars:
          SH: "/bin/bash"
